name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --manifest-path prototypes/app-server-queue/Cargo.toml --all -- --check

  clippy:
    name: Clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all targets and features
        run: cargo clippy --manifest-path prototypes/app-server-queue/Cargo.toml --locked --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: cargo test --manifest-path prototypes/app-server-queue/Cargo.toml --locked --all-targets --all-features
